<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiCam-PTZ</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body><div class="container">
<header><h1>📷 PiCam-PTZ</h1><p>Raspberry Pi 5 – Camera Module 3</p></header>
<main>
<section class="card">
<h2>Live Camera</h2>
<div class="video-container"><img id="camera-stream" src="{{ url_for('video_feed') }}" alt="PiCam-PTZ Live Video"></div>
<div class="record-controls">
<button id="record-button" class="record-button" type="button">🔴 REC</button>
<label for="record-duration">Maxlängd:</label>
<select id="record-duration" class="record-duration">
<option value="30">30 sek</option><option value="60" selected>1 min</option>
<option value="300">5 min</option><option value="600">10 min</option>
<option value="1800">30 min</option><option value="3600">60 min</option>
</select>
<span id="record-indicator" class="record-indicator" hidden>● REC</span>
<span id="record-timer" class="record-timer">00:00</span>
<a href="{{ url_for('video_gallery') }}" class="gallery-button">🎬 Videogalleri</a>
</div>
<p id="record-status" class="record-status" role="status" aria-live="polite"></p>
<div class="photo-controls">
<button id="take-photo" class="photo-button" type="button">📸 Ta kort</button>
<a href="{{ url_for('gallery') }}" class="gallery-button">🖼️ Bildgalleri</a>
<span id="photo-status" role="status" aria-live="polite"></span>
</div>
<div id="photo-preview" class="photo-preview" hidden>
<h3>Senaste fotografiet</h3>
<a id="photo-link" href="#" target="_blank" rel="noopener noreferrer"><img id="photo-image" alt="Senaste fotografiet"></a>
<p id="photo-filename"></p></div>
</section>
<section class="card"><h2>PTZ Control</h2><div class="ptz-controls">
<div class="direction-controls">
<button id="tilt-up" class="direction up" type="button" aria-label="Tilt upp">▲</button>
<button id="pan-left" class="direction left" type="button" aria-label="Pan vänster">◀</button>
<button id="center" class="center-button" type="button">CENTER</button>
<button id="pan-right" class="direction right" type="button" aria-label="Pan höger">▶</button>
<button id="tilt-down" class="direction down" type="button" aria-label="Tilt ned">▼</button>
</div>
<div class="slider-controls">
<div class="slider-group"><label for="pan-slider">Pan: <span id="pan-value">--</span>°</label><input type="range" id="pan-slider" min="60" max="120" value="90"></div>
<div class="slider-group"><label for="tilt-slider">Tilt: <span id="tilt-value">--</span>°</label><input type="range" id="tilt-slider" min="60" max="120" value="90"></div>
</div></div></section>
<section class="card"><h2>Servo Status</h2><div class="status-grid">
<div class="status-item"><span>Pan position</span><strong id="pan-position">--</strong></div>
<div class="status-item"><span>Pan target</span><strong id="pan-target">--</strong></div>
<div class="status-item"><span>Tilt position</span><strong id="tilt-position">--</strong></div>
<div class="status-item"><span>Tilt target</span><strong id="tilt-target">--</strong></div>
</div></section>
</main><footer><p>PiCam-PTZ | Raspberry Pi 5</p></footer>
</div></body></html>
